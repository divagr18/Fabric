<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Fabric connects your devices so agents can build tools from what is available</title>
  <desc id="desc">Laptops, phones, PCs, and people contribute files, cameras, compute, and approval to a dynamic WebMCP tool.</desc>

  <rect width="1600" height="500" fill="#000"/>

  <g font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="40" y="58" fill="#8f8f8f" font-size="22" letter-spacing="0.2">Dynamic WebMCP runtime</text>
    <text x="34" y="190" fill="#ededed" font-size="130" font-weight="600" letter-spacing="-6">Fabric</text>
    <text x="40" y="256" fill="#ededed" font-size="42" font-weight="400" letter-spacing="-1.2">Connect your devices.</text>
    <text x="40" y="310" fill="#ededed" font-size="42" font-weight="400" letter-spacing="-1.2">Build tools from what is available.</text>

    <g transform="translate(700 42) scale(1.1)">
      <!-- Capability providers -->
      <g>
        <rect x="0" y="18" width="164" height="58" fill="#050505" stroke="#737373" stroke-width="3"/>
        <text x="18" y="43" fill="#ededed" font-size="18" font-weight="500">Laptops</text>
        <text x="18" y="64" fill="#a1a1a1" font-size="14" font-weight="500" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Files</text>
      </g>
      <g>
        <rect x="0" y="98" width="164" height="58" fill="#050505" stroke="#737373" stroke-width="3"/>
        <text x="18" y="123" fill="#ededed" font-size="18" font-weight="500">Phones</text>
        <text x="18" y="144" fill="#a1a1a1" font-size="14" font-weight="500" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Cameras</text>
      </g>
      <g>
        <rect x="0" y="178" width="164" height="58" fill="#050505" stroke="#737373" stroke-width="3"/>
        <text x="18" y="203" fill="#ededed" font-size="18" font-weight="500">PCs</text>
        <text x="18" y="224" fill="#a1a1a1" font-size="14" font-weight="500" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Compute</text>
      </g>
      <g>
        <rect x="0" y="258" width="164" height="58" fill="#050505" stroke="#737373" stroke-width="3"/>
        <text x="18" y="283" fill="#ededed" font-size="18" font-weight="500">People</text>
        <text x="18" y="304" fill="#a1a1a1" font-size="14" font-weight="500" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Approval</text>
      </g>

      <!-- Live capability graph -->
      <line x1="164" y1="47" x2="216" y2="47" stroke="#737373" stroke-width="3"/>
      <line x1="164" y1="127" x2="216" y2="127" stroke="#737373" stroke-width="3"/>
      <line x1="164" y1="207" x2="216" y2="207" stroke="#737373" stroke-width="3"/>
      <line x1="164" y1="287" x2="216" y2="287" stroke="#737373" stroke-width="3"/>
      <line x1="216" y1="47" x2="216" y2="287" stroke="#737373" stroke-width="3"/>
      <line x1="216" y1="167" x2="260" y2="167" stroke="#ededed" stroke-width="3"/>
      <circle cx="216" cy="167" r="6" fill="#ededed"/>

      <!-- WebMCP compilation boundary -->
      <rect x="260" y="90" width="300" height="154" fill="#080808" stroke="#ededed" stroke-width="3"/>
      <text x="284" y="122" fill="#a1a1a1" font-size="15" font-weight="500" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WebMCP runtime</text>
      <text x="284" y="160" fill="#ededed" font-size="25" font-weight="500">Dynamic tool compiler</text>
      <text x="284" y="193" fill="#b3b3b3" font-size="14" font-weight="500" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">inspect → plan → register</text>
      <text x="284" y="220" fill="#a1a1a1" font-size="13" font-weight="500" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">validated · hot-swappable</text>

      <!-- Agent consumers -->
      <line x1="560" y1="167" x2="604" y2="167" stroke="#ededed" stroke-width="3"/>
      <circle cx="604" cy="167" r="6" fill="#ededed"/>
      <rect x="604" y="118" width="174" height="98" fill="#050505" stroke="#737373" stroke-width="3"/>
      <text x="626" y="158" fill="#ededed" font-size="22" font-weight="500">Agents</text>
      <text x="626" y="187" fill="#a1a1a1" font-size="13" font-weight="500" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">discover · call</text>
    </g>

    <line x1="40" y1="421.5" x2="1560" y2="421.5" stroke="#262626" stroke-width="2"/>
    <text x="40" y="468" fill="#8f8f8f" font-size="19" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">TypeScript</text>
    <text x="194" y="468" fill="#444">·</text>
    <text x="226" y="468" fill="#8f8f8f" font-size="19" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WebMCP</text>
    <text x="336" y="468" fill="#444">·</text>
    <text x="368" y="468" fill="#8f8f8f" font-size="19" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WebRTC</text>
    <text x="478" y="468" fill="#444">·</text>
    <text x="510" y="468" fill="#8f8f8f" font-size="19" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Cloudflare Workers</text>
    <text x="726" y="468" fill="#444">·</text>
    <text x="758" y="468" fill="#8f8f8f" font-size="19" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Durable Objects</text>
    <text x="948" y="468" fill="#444">·</text>
    <text x="980" y="468" fill="#8f8f8f" font-size="19" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WebGPU</text>
    <text x="1090" y="468" fill="#444">·</text>
    <text x="1122" y="468" fill="#8f8f8f" font-size="19" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WASM</text>
  </g>
</svg>
