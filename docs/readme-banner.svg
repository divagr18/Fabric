<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Fabric, one living runtime</title>
  <desc id="desc">Laptops, phones, PCs, and people contribute files, cameras, compute, and approval to a dynamic WebMCP tool.</desc>

  <rect width="1600" height="600" fill="#000"/>

  <g font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="88" y="112" fill="#8f8f8f" font-size="20" letter-spacing="0.2">Dynamic WebMCP runtime</text>
    <text x="84" y="238" fill="#ededed" font-size="112" font-weight="600" letter-spacing="-5">Fabric</text>
    <text x="88" y="302" fill="#ededed" font-size="36" font-weight="400" letter-spacing="-1">One living runtime for agents,</text>
    <text x="88" y="350" fill="#ededed" font-size="36" font-weight="400" letter-spacing="-1">devices, and people.</text>

    <g transform="translate(818 92)">
      <line x1="0" y1="55" x2="188" y2="55" stroke="#525252" stroke-width="2"/>
      <line x1="0" y1="135" x2="188" y2="135" stroke="#525252" stroke-width="2"/>
      <line x1="0" y1="215" x2="188" y2="215" stroke="#525252" stroke-width="2"/>
      <line x1="0" y1="295" x2="188" y2="295" stroke="#525252" stroke-width="2"/>
      <line x1="188" y1="55" x2="188" y2="295" stroke="#525252" stroke-width="2"/>
      <line x1="188" y1="175" x2="278" y2="175" stroke="#ededed" stroke-width="2"/>

      <circle cx="0" cy="55" r="5" fill="#ededed"/>
      <circle cx="0" cy="135" r="5" fill="#ededed"/>
      <circle cx="0" cy="215" r="5" fill="#ededed"/>
      <circle cx="0" cy="295" r="5" fill="#ededed"/>
      <circle cx="188" cy="175" r="6" fill="#ededed"/>

      <g>
        <rect x="14" y="28" width="126" height="53" fill="#000"/>
        <text x="20" y="51" fill="#ededed" font-size="19" font-weight="500">Laptops</text>
        <text x="20" y="73" fill="#737373" font-size="15" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Files</text>
      </g>
      <g>
        <rect x="14" y="108" width="126" height="53" fill="#000"/>
        <text x="20" y="131" fill="#ededed" font-size="19" font-weight="500">Phones</text>
        <text x="20" y="153" fill="#737373" font-size="15" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Cameras</text>
      </g>
      <g>
        <rect x="14" y="188" width="126" height="53" fill="#000"/>
        <text x="20" y="211" fill="#ededed" font-size="19" font-weight="500">PCs</text>
        <text x="20" y="233" fill="#737373" font-size="15" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Compute</text>
      </g>
      <g>
        <rect x="14" y="268" width="126" height="53" fill="#000"/>
        <text x="20" y="291" fill="#ededed" font-size="19" font-weight="500">People</text>
        <text x="20" y="313" fill="#737373" font-size="15" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Approval</text>
      </g>

      <rect x="279" y="112" width="360" height="126" rx="0" fill="#0a0a0a" stroke="#ededed" stroke-width="2"/>
      <text x="308" y="158" fill="#8f8f8f" font-size="17">Compiled at runtime</text>
      <text x="308" y="202" fill="#ededed" font-size="28" font-weight="500">WebMCP tool</text>
    </g>

    <line x1="88" y1="482.5" x2="1512" y2="482.5" stroke="#262626"/>
    <text x="88" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">TypeScript</text>
    <text x="236" y="535" fill="#444">·</text>
    <text x="268" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WebMCP</text>
    <text x="372" y="535" fill="#444">·</text>
    <text x="404" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WebRTC</text>
    <text x="508" y="535" fill="#444">·</text>
    <text x="540" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Cloudflare Workers</text>
    <text x="746" y="535" fill="#444">·</text>
    <text x="778" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Durable Objects</text>
    <text x="960" y="535" fill="#444">·</text>
    <text x="992" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WebGPU</text>
    <text x="1096" y="535" fill="#444">·</text>
    <text x="1128" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WASM</text>
  </g>
</svg>
