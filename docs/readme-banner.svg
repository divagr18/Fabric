<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Fabric, one living runtime</title>
  <desc id="desc">Laptops, phones, PCs, and people contribute files, cameras, compute, and approval to a dynamic WebMCP tool.</desc>

  <rect width="1600" height="600" fill="#000"/>

  <g font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="88" y="112" fill="#8f8f8f" font-size="20" letter-spacing="0.2">Dynamic WebMCP runtime</text>
    <text x="84" y="238" fill="#ededed" font-size="112" font-weight="600" letter-spacing="-5">Fabric</text>
    <text x="88" y="302" fill="#ededed" font-size="36" font-weight="400" letter-spacing="-1">One living runtime for agents,</text>
    <text x="88" y="350" fill="#ededed" font-size="36" font-weight="400" letter-spacing="-1">devices, and people.</text>

    <g transform="translate(760 82)">
      <!-- Capability providers -->
      <g>
        <rect x="0" y="18" width="164" height="58" fill="#050505" stroke="#525252" stroke-width="2"/>
        <text x="18" y="43" fill="#ededed" font-size="18" font-weight="500">Laptops</text>
        <text x="18" y="64" fill="#737373" font-size="14" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Files</text>
      </g>
      <g>
        <rect x="0" y="98" width="164" height="58" fill="#050505" stroke="#525252" stroke-width="2"/>
        <text x="18" y="123" fill="#ededed" font-size="18" font-weight="500">Phones</text>
        <text x="18" y="144" fill="#737373" font-size="14" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Cameras</text>
      </g>
      <g>
        <rect x="0" y="178" width="164" height="58" fill="#050505" stroke="#525252" stroke-width="2"/>
        <text x="18" y="203" fill="#ededed" font-size="18" font-weight="500">PCs</text>
        <text x="18" y="224" fill="#737373" font-size="14" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Compute</text>
      </g>
      <g>
        <rect x="0" y="258" width="164" height="58" fill="#050505" stroke="#525252" stroke-width="2"/>
        <text x="18" y="283" fill="#ededed" font-size="18" font-weight="500">People</text>
        <text x="18" y="304" fill="#737373" font-size="14" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Approval</text>
      </g>

      <!-- Live capability graph -->
      <line x1="164" y1="47" x2="216" y2="47" stroke="#737373" stroke-width="3"/>
      <line x1="164" y1="127" x2="216" y2="127" stroke="#737373" stroke-width="3"/>
      <line x1="164" y1="207" x2="216" y2="207" stroke="#737373" stroke-width="3"/>
      <line x1="164" y1="287" x2="216" y2="287" stroke="#737373" stroke-width="3"/>
      <line x1="216" y1="47" x2="216" y2="287" stroke="#737373" stroke-width="3"/>
      <line x1="216" y1="167" x2="260" y2="167" stroke="#ededed" stroke-width="3"/>
      <circle cx="216" cy="167" r="6" fill="#ededed"/>

      <!-- WebMCP compilation boundary -->
      <rect x="260" y="90" width="300" height="154" fill="#080808" stroke="#ededed" stroke-width="3"/>
      <text x="284" y="122" fill="#8f8f8f" font-size="15" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WebMCP runtime</text>
      <text x="284" y="160" fill="#ededed" font-size="25" font-weight="500">Dynamic tool compiler</text>
      <text x="284" y="193" fill="#a1a1a1" font-size="14" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">inspect → plan → register</text>
      <text x="284" y="220" fill="#737373" font-size="13" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">validated · hot-swappable</text>

      <!-- Agent consumers -->
      <line x1="560" y1="167" x2="604" y2="167" stroke="#ededed" stroke-width="3"/>
      <circle cx="604" cy="167" r="6" fill="#ededed"/>
      <rect x="604" y="118" width="174" height="98" fill="#050505" stroke="#525252" stroke-width="2"/>
      <text x="626" y="158" fill="#ededed" font-size="22" font-weight="500">Agents</text>
      <text x="626" y="187" fill="#737373" font-size="13" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">discover · call</text>
    </g>

    <line x1="88" y1="482.5" x2="1512" y2="482.5" stroke="#262626"/>
    <text x="88" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">TypeScript</text>
    <text x="236" y="535" fill="#444">·</text>
    <text x="268" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WebMCP</text>
    <text x="372" y="535" fill="#444">·</text>
    <text x="404" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WebRTC</text>
    <text x="508" y="535" fill="#444">·</text>
    <text x="540" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Cloudflare Workers</text>
    <text x="746" y="535" fill="#444">·</text>
    <text x="778" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Durable Objects</text>
    <text x="960" y="535" fill="#444">·</text>
    <text x="992" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WebGPU</text>
    <text x="1096" y="535" fill="#444">·</text>
    <text x="1128" y="535" fill="#8f8f8f" font-size="18" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">WASM</text>
  </g>
</svg>
